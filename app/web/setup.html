<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="setup.title">雀魂教练 · 首次设置</title>
<style>
  :root{--bg:#14161b;--card:#1c1f26;--line:#2b303b;--fg:#e8e6e3;--dim:#9aa0ab;--ok:#4ade80;--bad:#f87171;--warn:#fbbf24;--acc:#e0a96d}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.6 "Microsoft YaHei",system-ui,sans-serif}
  .wrap{max-width:720px;margin:0 auto;padding:32px 20px 64px}
  h1{font-size:20px;margin:0 0 4px;font-weight:600}
  .sub{color:var(--dim);margin-bottom:24px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin-bottom:14px}
  .row{display:flex;align-items:center;gap:10px;padding:6px 0}
  .row .name{flex:1}
  .badge{font-size:12px;padding:1px 8px;border-radius:20px;border:1px solid var(--line)}
  .ok{color:var(--ok);border-color:#25603c}
  .bad{color:var(--bad);border-color:#61272b}
  .warn{color:var(--warn);border-color:#5c4a1c}
  .dim{color:var(--dim)}
  code{background:#111318;padding:1px 5px;border-radius:4px;font-size:12px;color:#c8b7a4}
  button{background:var(--acc);color:#1a1208;border:0;border-radius:7px;padding:8px 14px;font-size:13px;cursor:pointer;font-weight:600}
  button:disabled{opacity:.45;cursor:not-allowed}
  button.ghost{background:transparent;color:var(--fg);border:1px solid var(--line);font-weight:400}
  a{color:var(--acc)}
  .bar{height:6px;background:#111318;border-radius:4px;overflow:hidden;margin-top:10px}
  .bar i{display:block;height:100%;background:var(--acc);width:0;transition:width .3s}
  .foot{color:var(--dim);font-size:12px;margin-top:22px}
  .step{color:var(--acc);font-weight:600;margin-right:6px}
</style>
<script src="/i18n-client.js"></script>
</head>
<body>
<div class="wrap">
  <h1 data-i18n="setup.title">雀魂教练 · 首次设置</h1>
  <div class="sub" id="ver" data-i18n="setup.reading">正在读取状态…</div>

  <div class="card">
    <div class="row"><span class="step">1</span><span class="name" data-i18n="setup.step.env">运行环境</span><span class="badge" id="bEnv" data-i18n="setup.badge.checking">检查中</span></div>
    <div class="row dim" id="envDetail" style="font-size:12px"></div>
  </div>

  <div class="card">
    <div class="row"><span class="step">2</span><span class="name" data-i18n="setup.step.model">决策模型</span><span class="badge" id="bModel" data-i18n="setup.badge.checking">检查中</span></div>
    <div class="row dim" id="modelDetail" style="font-size:12px"></div>
    <div class="row" id="modelActions" style="display:none">
      <button id="btnDownload" data-i18n="setup.model.download">下载模型</button>
      <span class="dim" id="dlHint"></span>
    </div>
    <div class="bar" id="barWrap" style="display:none"><i id="bar"></i></div>
  </div>

  <div class="card">
    <div class="row"><span class="step">3</span><span class="name" data-i18n="setup.step.script">浏览器脚本</span><span class="badge" id="bScript" data-i18n="setup.badge.toInstall">待安装</span></div>
    <div class="row dim" id="scriptHint" style="font-size:12px" data-i18n="setup.script.hint"></div>
    <div class="row">
      <button id="btnScript" data-i18n="setup.script.install">安装 / 更新脚本</button>
      <button class="ghost" id="btnTamper" data-i18n="setup.script.tamper">先装 Tampermonkey</button>
    </div>
  </div>

  <div class="card">
    <div class="row"><span class="step">4</span><span class="name" data-i18n="setup.step.game">连接游戏</span><span class="badge" id="bGame" data-i18n="setup.badge.waiting">等待游戏页面</span></div>
    <div class="row dim" id="gameDetail" style="font-size:12px" data-i18n="setup.game.detail"></div>
    <div class="row"><button id="btnGame" data-i18n="setup.game.open">打开雀魂</button>
      <button class="ghost" id="btnSettings" data-i18n="setup.game.settings">更多设置</button></div>
  </div>

  <div class="foot" id="foot"></div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const T = (k, v) => (window.I18N ? I18N.t(k, v) : k);
let cfg = null;

function badge(el, text, kind) {
  el.textContent = text;
  el.className = 'badge ' + (kind || '');
}

async function refresh() {
  if (!window.I18N || !I18N.lang) await I18N.init();
  try {
    const r = await fetch('/config', { cache: 'no-store' });
    cfg = await r.json();
  } catch (e) {
    $('ver').textContent = T('setup.noServer');
    return;
  }
  $('ver').textContent = (cfg.product || 'Mahjong Soul Coach') + ' v' + cfg.version;
  $('foot').textContent = T('setup.foot', { ver: cfg.version, port: cfg.port });

  const eng = cfg.engine || {};
  if (eng.pythonFound && eng.vcRuntime !== false) { badge($('bEnv'), T('setup.badge.ok'), 'ok'); $('envDetail').textContent = T('setup.env.okDetail'); }
  else if (!eng.pythonFound) { badge($('bEnv'), T('setup.badge.missingRuntime'), 'bad'); $('envDetail').textContent = T('setup.env.noPy'); }
  else { badge($('bEnv'), T('setup.badge.missingVc'), 'bad'); $('envDetail').textContent = T('setup.env.noVc'); }

  const m = eng.model;
  if (m === 'full') { badge($('bModel'), T('setup.badge.readyS42'), 'ok'); $('modelDetail').textContent = String(eng.modelLabel || '').replace('（完整版）', T('boot.modelFull')) + ' · ' + (eng.modelSizeMB || 0) + ' MB'; $('modelActions').style.display = 'none'; }
  else if (m === 'lite') { badge($('bModel'), T('setup.badge.lite'), 'warn'); $('modelDetail').textContent = T('setup.model.liteHint'); $('modelActions').style.display = 'flex'; }
  else { badge($('bModel'), T('setup.badge.notDownloaded'), 'bad'); $('modelDetail').textContent = T('setup.model.noneHint'); $('modelActions').style.display = 'flex'; }

  const frames = cfg.frames || 0;
  const stale = frames > 0 && cfg.scriptLang && cfg.uiLang && cfg.scriptLang !== cfg.uiLang;
  if (stale) {
    // 切了语言但脚本还是旧的：明确告诉用户要重装，而不是继续显示绿色「已生效」
    badge($('bScript'), T('setup.badge.stale'), 'bad');
    $('scriptHint').textContent = T('setup.script.staleHint');
  } else if (frames > 0) {
    const ago = cfg.lastFrameAt ? Math.round((Date.now() - cfg.lastFrameAt) / 1000) : null;
    badge($('bGame'), T('setup.game.connected', { frames }), 'ok');
    $('gameDetail').textContent = ago !== null && ago < 30 ? T('setup.game.justNow') : (ago === null ? T('setup.game.never') : T('setup.game.secondsAgo', { n: ago }));
    badge($('bScript'), T('setup.badge.effective'), 'ok');
  } else {
    badge($('bGame'), T('setup.badge.waiting'), '');
    $('gameDetail').textContent = T('setup.game.detail');
    badge($('bScript'), T('setup.badge.toInstall'), '');
  }
}

async function pollDownload() {
  const s = await (await fetch('/api/model/status', { cache: 'no-store' })).json();
  if (s.state === 'downloading' || s.state === 'verifying') {
    $('barWrap').style.display = 'block';
    const pct = s.percent != null ? s.percent : 0;
    $('bar').style.width = pct + '%';
    $('dlHint').textContent = s.state === 'verifying' ? T('setup.model.verifying')
      : (s.percent != null ? pct + '%' : (s.received / 1048576).toFixed(1) + ' MB');
    $('btnDownload').disabled = true;
    setTimeout(pollDownload, 500);
  } else if (s.state === 'done') {
    $('bar').style.width = '100%';
    $('dlHint').textContent = T('setup.model.done');
    $('btnDownload').disabled = false;
    setTimeout(refresh, 500);
  } else if (s.state === 'error') {
    $('dlHint').textContent = T('setup.model.failed', { msg: s.error || T('setup.noServer') });
    $('btnDownload').disabled = false;
  }
}

$('btnDownload').onclick = async () => {
  const r = await (await fetch('/api/model/download', { method: 'POST' })).json();
  if (!r.started) $('dlHint').textContent = r.reason || T('setup.model.cannotStart');
  pollDownload();
};
$('btnScript').onclick = () => {
  window.open('/coach.user.js', '_blank');
  $('scriptHint').textContent = T('setup.script.fallback');
};
$('btnTamper').onclick = () => { window.open('https://www.tampermonkey.net/', '_blank'); };
// 按界面语言开对应服务器：日文→日服，英/韩→英文服（Global），其余→国际中文服
$('btnGame').onclick = () => {
  const l = (window.I18N && I18N.lang) || 'zh-CN';
  const url = l === 'ja' ? 'https://game.mahjongsoul.com/'
    : (l === 'en' || l === 'ko') ? 'https://mahjongsoul.game.yo-star.com/'
    : 'https://game.maj-soul.com/1/';
  window.open(url, '_blank');
};
$('btnSettings').onclick = () => { location.href = '/settings'; };

I18N.init().then(refresh);
setInterval(refresh, 2000);
</script>
</body>
</html>
